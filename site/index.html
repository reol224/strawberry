<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#25262d">
  <title>Strawberry Playground</title>
  <link rel="stylesheet" href="style.css">
  <script src="wasm_exec.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">✿</span><span>strawberry</span></a>
    <span class="topbar-title">PLAYGROUND</span>
    <nav aria-label="Main navigation">
      <a href="docs/">Docs</a>
      <a href="https://github.com/reol224/strawberry">Source ↗</a>
    </nav>
  </header>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Playground options">
      <section class="sidebar-section">
        <h2 class="sidebar-heading">Examples</h2>
        <button class="example active" type="button" data-code="2 * (3 + 4)" aria-pressed="true" disabled>Arithmetic</button>
        <button class="example" type="button" data-code="3 < 8" aria-pressed="false" disabled>Comparison</button>
        <button class="example" type="button" data-code="!false" aria-pressed="false" disabled>Boolean</button>
        <button class="example" type="button" data-code="-12" aria-pressed="false" disabled>Prefix operator</button>
      </section>

      <section class="sidebar-section settings">
        <h2 class="sidebar-heading">Settings</h2>
        <label class="setting-row" for="wrap-lines">
          <input id="wrap-lines" type="checkbox" checked>
          <span>Line wrap</span>
        </label>
      </section>

      <section class="sidebar-section language-info">
        <h2 class="sidebar-heading">Strawberry</h2>
        <p>A small interpreter written in Go. The language is still growing.</p>
        <a href="docs/">Read the language notes ↗</a>
      </section>
    </aside>

    <main class="workspace" aria-label="Strawberry code playground">
      <h1 class="sr-only">Strawberry Playground</h1>
      <section class="editor-pane" aria-labelledby="program-title">
        <div class="pane-toolbar">
          <h2 id="program-title" class="pane-tab active">Program</h2>
          <span class="filename">example.strb</span>
        </div>
        <div class="editor-body">
          <pre id="line-numbers" class="line-numbers" aria-hidden="true">1</pre>
          <textarea id="source" aria-label="Program editor" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="soft">2 * (3 + 4)</textarea>
        </div>
        <div class="pane-footer">
          <button id="run" type="button" disabled>▶ Run</button>
          <span class="hint">Ctrl / ⌘ + Enter</span>
        </div>
      </section>

      <section class="output-pane" aria-labelledby="output-title">
        <div class="pane-toolbar">
          <h2 id="output-title" class="pane-tab active">Output</h2>
          <span id="runtime-status" class="status" role="status">Starting WebAssembly…</span>
        </div>
        <pre id="output" aria-live="polite">Waiting for the interpreter…</pre>
      </section>
    </main>
  </div>
</body>
</html>
